<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strona główna</title>
<meta name="description" content="Moje małe projekty i narzędzia.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🏠%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f7;--fg:#13202b;--mut:#5a6874;--line:#d3dbe0;--acc:#0b6e8a;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0e161c;--fg:#e6edf2;--mut:#91a0ac;--line:#25333e;--acc:#5cc2de}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:clamp(32px,10vh,96px) 20px 48px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.lead{color:var(--mut);margin:0 0 40px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
a{display:block;padding:18px 4px;color:inherit;text-decoration:none}
a:hover .t,a:focus-visible .t{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.t{display:block;font-weight:650;font-size:19px}
.d{display:block;color:var(--mut);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Strona główna</h1>
  <p class="lead">Moje małe projekty i narzędzia.</p>
  <ul>
    <li>
      <a href="mapowka-azja.html">
        <span class="t">Mapówka: Azja</span>
        <span class="d">Quiz z państw i stolic Azji na mapie z numerami.</span>
      </a>
    </li>
    <!-- Nowa strona: skopiuj cały blok <li>…</li> powyżej, zmień href, tytuł i opis. -->
  </ul>
</main>
</body>
</html>
